## Name of the distribution, also defines the name of the constructor function
name: NegativeBinomial

## Name of parameters and supported range/values. Parameters are zipped row
## by row (equal lengths). The (size, p) parameterization is tested here; the
## alternative (mu, size) parameterization is covered in test-NegativeBinomial.R.
parameters:
  valid:
    size: [0.5, 1.5, 3, 10, 100]
    p:    [0.2, 0.5, 0.9, 0.3, 0.6]

support:
  lower: 0
  upper: .inf

distributiontype:
  discrete: true
  continuous: false

tolerance:
  mean: 1e-3
  variance: 1e-1
  skewness: 1e-1
  kurtosis: 1e-0

tests:
  exclude:
    ## TODO(R): Getting -Inf from analytic CRPS but positive
    ## value from numeric approximation for some combinations;
    ## thus excluded for now.
    ##     d <- NegativeBinomial(0.5, 0.2)
    ##     crps(d, 1) ## [1] -Inf
    ##     distributions3:::crps.distribution(d, 1) ##[1] 0.4981778
    - crps_compare2numeric

