

## Name of the distribution, also defines the name of the constructor function
name: Poisson

## Name of parameters and supported range/values.
parameters:
  valid:
    lambda: [0.1, 1.5, 2, 5.5, 100]
  invalid:
    lambda: [-10, -1e-10]

support:
  lower: 0
  upper: .inf

distributiontype:
  discrete: true
  continuous: false

tolerance:
  mean: 1e-3
  variance: 1e-2
  skewness: 1e-1
  kurtosis: 1e-0
