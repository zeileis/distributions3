

## Name of the distribution, also defines the name of the constructor function
name: GammaR

## Name of parameters and supported range/values.
parameters:
  valid:
    mu:    [2, 3, 4, 10]
    sigma: [1, 0.5, 0.25, 0.1]
  invalid:
    mu:    [-1, -1, -1]
    sigma: [-0.1, -1, -10000]

support:
  lower: 0
  upper: .inf

distributiontype:
  discrete: false
  continuous: true

