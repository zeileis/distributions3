

## Name of the distribution, also defines the name of the constructor function
name: GammaR

## Name of parameters and supported range/values.
parameters:
  valid:
    mu:     [  4,   3, 1,  10]
    sigma:  [0.5, 0.2, 1, 0.3]
  invalid:
    mu:     [-10, -1, -1e-10]
    sigma:  [-10, -1, -1e-10]

support:
  lower: 0
  upper: .inf

distributiontype:
  discrete: false
  continuous: true

tolerance:
  variance: 1e-2
  crps: 1e-2
