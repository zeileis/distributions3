

## Name of the distribution, also defines the name of the constructor function
name: Exponential

## Name of parameters and supported range/values.
parameters:
  valid:
    rate:  [0.1,  0.5, 1, 2]
  invalid:
    rate:  [-10, -1, -0.00000001]

support:
  lower: 0
  upper: .inf

distributiontype:
  discrete: false
  continuous: true

tolerance:
  mean: 1e-3
  variance: 1e-2
