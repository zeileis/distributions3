

## Name of the distribution, also defines the name of the constructor function
name: ExponentialR

## Name of parameters and supported range/values.
parameters:
  valid:
    mu:  [10,  2, 1, 0.5]
  invalid:
    mu:  [-0.1, -1, -0.00000001]

support:
  lower: 0
  upper: .inf

distributiontype:
  discrete: false
  continuous: true

tolerance:
  mean: 1e-3
  variance: 1e-2
