

## Name of the distribution, also defines the name of the constructor function
name: GAMLSS

## Name of parameters and supported range/values.
parameters:
  extra:
    family: EXP
  valid:
    mu:  [10,  2, 1, 0.5]

support:
  lower: 0
  upper: .inf

tolerance:
  variance: 1e-1

distributiontype:
  discrete: false
  continuous: true

tests:
  exclude:
    - params_NA
    - autotest_score_defaults
    - autotest_hessian_defaults
