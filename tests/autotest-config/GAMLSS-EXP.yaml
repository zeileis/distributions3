

## Name of the distribution, also defines the name of the constructor function
name: GAMLSS

## Name of parameters and supported range/values.
parameters:
  extra:
    family: EXP
  valid:
    mu:  [10,  2, 1, 0.5]
  invalid:
    mu:  [-0.1, -1, -0.00000001]

support:
  lower: 0
  upper: .inf

tolerance:
  variance: 1e-1

distributiontype:
  discrete: false
  continuous: true

tests:
  exclude:
    ## GAMLSS does not allow this
    - params_NA
    ## not yet implemented
    - skewness
    - skewness_compare2numeric
    - kurtosis
    - kurtosis_compare2numeric
