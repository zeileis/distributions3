

## Name of the distribution, also defines the name of the constructor function
name: LogNormal

## Name of parameters and supported range/values.
parameters:
  valid:
    log_mu:    [0, 0.25, 0.75, 1.25, 1.50]
    log_sigma: [2, 1.50, 1.00, 0.50, 0.20]
  invalid:
    log_sigma: [-10, -1, -1e-10]

support:
  lower: 0
  upper: .inf

distributiontype:
  discrete: false
  continuous: true

skip_if_not_installed:
  crps_defaults: scoringRules
  crps_compare2numeric: scoringRules

tolerance:
  cdf: 1e-5
  crps: 1e-3
