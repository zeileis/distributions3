

## Name of the distribution, also defines the name of the constructor function
name: GAMLSS

## Name of parameters and supported range/values.
parameters:
  extra:
    family: NO2
  valid:
    mu:    [ -10.0, -1,  0,  1,  10]
    sigma: [   0.5,  1,  2,  5, 100]
  invalid:
    sigma: [-10, -1e-10]

support:
  lower: -.inf
  upper: .inf

distributiontype:
  discrete: false
  continuous: true

tests:
  exclude:
    ## GAMLSS does not allow this
    - params_NA
    ## not yet implemented
    - skewness
    - skewness_compare2numeric
    - kurtosis
    - kurtosis_compare2numeric
