

## Name of the distribution, also defines the name of the constructor function
name: GAMLSS

## Name of parameters and supported range/values.
parameters:
  extra:
    family: "NO"
  valid:
    mu:    [ -10.0, -1,  0,  1,  10]
    sigma: [   0.5,  1,  2,  5, 100]

support:
  lower: -.inf
  upper: .inf

distributiontype:
  discrete: false
  continuous: true

tests:
  exclude:
    - params_NA
