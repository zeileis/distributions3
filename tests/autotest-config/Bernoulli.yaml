

## Name of the distribution, also defines the name of the constructor function
name: Bernoulli

## Name of parameters and supported range/values.
parameters:
  valid:
    p: [0, 0.0001, 0.5, 0.9999, 1]
  invalid:
    p: [-1, -0.00001, 1.00001, 2]

support:
  lower: 0.0
  upper: 1.0

distributiontype:
  discrete: true
  continuous: false

## Skipping a series of tests if the R package 'revdbayes' is not
## installed (suggested package).
skip_if_not_installed:
  autotest_score_compare2numeric: revdbayes
  autotest_hessian_observed_compare2numeric: revdbayes
  autotest_hessian_expected_compare2numeric: revdbayes

tests:
  exclude:
    ## With p = 0 and p = 1 (edge cases) these autotests fail,
    ## manual tests added to test-Bernoulli.R
    - score_compare2numeric
    - hessian_expected_compare2numeric
    - hessian_observed_compare2numeric

