

## Name of the distribution, also defines the name of the constructor function
name: Cauchy

## Name of parameters and supported range/values.
parameters:
  valid:
    location: [ -10, -1,  0,  4,  20]
    scale:    [   1,  1,  2,  5,  10]
  invalid:
    scale: [-10, -1, -1e-10]

support:
  lower: -.inf
  upper: .inf

distributiontype:
  discrete: false
  continuous: true

tests:
  exclude:
    ## Moments all return NaN
    - mean
    - variance
    - skewness
    - kurtosis
    - mean_compare2numeric
    - variance_compare2numeric
    - skewness_compare2numeric
    - kurtosis_compare2numeric
