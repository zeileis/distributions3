## Name of the distribution, also defines the name of the constructor function
name: HurdlePoisson

## Name of parameters and supported range/values. Parameters are zipped row
## by row (equal lengths). Here 'pi' is P(X > 0), as in countreg.
parameters:
  valid:
    lambda: [0.5, 1.5, 3, 10, 0.1]
    pi:     [0.1, 0.5, 0.9, 0.3, 0.7]

support:
  lower: 0
  upper: .inf

distributiontype:
  discrete: true
  continuous: false

tests:
  exclude:
    ## TODO(R): if pi is NA we get a return from dpqr; assuming
    ## to just go for Poisson?
    - params_NA
    - quantile
