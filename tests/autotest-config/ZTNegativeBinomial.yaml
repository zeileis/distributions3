## Name of the distribution, also defines the name of the constructor function
name: ZTNegativeBinomial

## Name of parameters and supported range/values. Parameters are zipped row
## by row (equal lengths).
parameters:
  valid:
    mu:    [0.5, 2, 5, 10, 3]
    theta: [0.5, 1.5, 10, 2, 0.8]
  invalid:
    mu:    [-10, -1, -0.001]
    theta: [-10, -1, -0.001]

support:
  lower: 1
  upper: .inf

distributiontype:
  discrete: true
  continuous: false

tolerance:
  mean: 1e-2
  variance: 1e-1
  skewness: 1e-1
  kurtosis: 1e-0

tests:
  exclude:
    ## TODO(R): Excluding quantile tests as we get finite
    ## values when prob < 0, expecting NaN.
    - quantile
