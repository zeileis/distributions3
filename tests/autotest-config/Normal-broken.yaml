

## Name of the distribution, also defines the name of the constructor function
name: Normal

## Name of parameters and supported range/values.
parameters:
  valid:
    mu:    [ -10, -1, 0, 1,  10]
    sigma: [0.01,  1, 2, 5, 100]
  invalid:
    sigma: [-10, -1E-3, 0]
support:
  lower: -.inf
  upper: .inf
tests:
  exclude:
    - cdf
    - log_pdf
